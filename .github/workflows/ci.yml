# The PR check. Docs-only PRs run only the docs check; browser tests run only when client files
# change; tests run in four parallel shards. "PR check" is the one job to require on main.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      client: ${{ steps.diff.outputs.client }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            # Started by hand or by the post-deploy check: run everything.
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "client=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE"...HEAD)
          echo "$files"
          code=false; client=false
          if echo "$files" | grep -qvE '^(docs/|\.claude/|CLAUDE\.md$|README\.md$|PRODUCT\.md$|DESIGN\.md$|THIRD_PARTY_NOTICES\.md$|\.github/pull_request_template\.md$)'; then code=true; fi
          if echo "$files" | grep -qE '^(src/client/|src/shared/|static/|e2e/|vite\.config\.ts$|package(-lock)?\.json$)'; then client=true; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"; echo "client=$client" >> "$GITHUB_OUTPUT"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-docs.mjs

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run --shard=${{ matrix.shard }}/4

  browser:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Playwright and Chromium
        run: |
          npm install -g playwright@1
          playwright install --with-deps chromium
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$(NODE_PATH=$(npm root -g) node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - run: npm run build
      - name: Start the app
        run: |
          APP_URL=http://localhost:8787 npm start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:8787/api/health && exit 0; sleep 2; done
          cat server.log; exit 1
      - run: NODE_PATH=$(npm root -g) npm run test:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check
          path: |
            e2e/output
            server.log
          if-no-files-found: ignore

  pr-check:
    name: PR check
    needs: [changes, docs, build, tests, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were not needed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then exit 1; fi
          done
