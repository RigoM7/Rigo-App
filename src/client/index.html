<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F7F4" />
    <meta name="description" content="Rigo: one place to run your business, whatever it is. Bookings, schedule, your team on their phones, invoices and payments." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Rigo</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash. Light is the default.
      try { var p = localStorage.getItem('rigo-theme') || 'light'; var d = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.dataset.theme = d ? 'dark' : 'light'; } catch (e) {}
    </script>
    <style>
      /* Shown until the app starts (R17-m3), so a slow first visit is never a blank page. */
      .boot { min-height: 100dvh; display: grid; place-items: center; align-content: center; gap: 14px; margin: 0; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #4A5751; background: #F5F7F4; }
      [data-theme="dark"] .boot { color: #A7B4AE; background: #0F1513; }
      .boot img { width: 40px; height: 40px; }
      .boot-bar { width: 120px; height: 3px; border-radius: 2px; background: rgba(127,127,127,.25); overflow: hidden; }
      .boot-bar::after { content: ""; display: block; width: 40%; height: 100%; background: currentColor; animation: boot 1.1s ease-in-out infinite; }
      @keyframes boot { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot-bar::after { animation: none; width: 100%; opacity: .5; } }
      body { margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status"><img src="/icon.svg" alt="" /><span>Opening Rigo…</span><div class="boot-bar" aria-hidden="true"></div></div></div>
    <noscript>Rigo needs JavaScript to run.</noscript>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
