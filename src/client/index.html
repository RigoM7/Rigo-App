<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="Rigo: business management and automation for field-service companies." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Rigo</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash. Light is the default.
      try { var p = localStorage.getItem('rigo-theme') || 'light'; var d = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.dataset.theme = d ? 'dark' : 'light'; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Rigo needs JavaScript to run.</noscript>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
